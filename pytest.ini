[pytest]
# Default command-line flags
addopts = -v --html=report.html --self-contained-html

# Direct PyTest to find tests in the 'tests' directory
testpaths = tests

# Custom markers for organizing test execution
markers =
    ui: Marks tests as UI Selenium tests
    api: Marks tests as API requests tests
    db: Marks tests as SQL database tests

# Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S